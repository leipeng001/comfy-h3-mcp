[project]
name = "comfy-h3-mcp"
version = "0.1.0"
description = "Focused MCP server for MiniMax-H3 video+audio generation on a local ComfyUI"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.scripts]
comfy-h3-mcp = "comfy_h3_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comfy_h3_mcp"]
